name: Release

# Builds the programs for each platform, publishes the crate to crates.io, then creates a GitHub
# release with the archives attached (cargo-binstall reads them, see [package.metadata.binstall]).
# To release, bump `version` in Cargo.toml (and the mdown entry in Cargo.lock), commit, then either
#   - in the browser: Actions > Release > Run workflow, on main. The release step creates the
#     tag v<version> on that commit; or
#   - from a terminal: git tag v<version> && git push origin v<version>
# Don't create the release by hand on GitHub: this workflow makes it once the crate is published.
# Publishing needs a crates.io API token stored as the repository secret CARGO_REGISTRY_TOKEN.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag from the version in Cargo.toml
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "Run this workflow on main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag is already released: bump the version in Cargo.toml first"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, format: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, format: tgz }
          - { os: macos-latest, target: x86_64-apple-darwin, format: tgz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package (zip)
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          $out = "mdown-${{ matrix.target }}-${{ needs.check.outputs.tag }}"
          New-Item -ItemType Directory $out | Out-Null
          foreach ($b in "mdown", "mdown-app") { Copy-Item "target/${{ matrix.target }}/release/$b.exe" $out }
          Copy-Item README.md, LICENSE $out
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"

      - name: Package (tgz)
        if: matrix.format == 'tgz'
        run: |
          out="mdown-${{ matrix.target }}-${{ needs.check.outputs.tag }}"
          mkdir "$out"
          for b in mdown mdown-app; do cp "target/${{ matrix.target }}/release/$b" "$out/"; done
          cp README.md LICENSE "$out/"
          tar -czf "$out.tgz" -C "$out" .

      - uses: actions/upload-artifact@v4
        with:
          name: mdown-${{ matrix.target }}
          path: mdown-*.${{ matrix.format }}

  # Runs on Windows because `cargo publish` compiles the packaged crate to verify it, and the
  # Linux runner has no WebKitGTK for wry. It only starts once every platform has built.
  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # binstall looks the version up on crates.io, so the release is only created once that worked.
  release:
    needs: [check, build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # On a manual run the tag doesn't exist yet; --target creates it on the commit just built.
        run: gh release create "${{ needs.check.outputs.tag }}" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "${{ needs.check.outputs.tag }}" --generate-notes
